[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
sieve-core = { path = "crates/sieve-core" }
sieve-device = { path = "crates/sieve-device" }
sieve-ui = { path = "crates/sieve-ui" }

anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
bytes = { version = "1.12.1", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde-well-known", "formatting"] }
tokio = { version = "1.54.0", features = ["full"] }
tokio-util = "0.7"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
