[package]
name = "sieve-core"
description = "CA, MITM proxy, and Flow model for sieve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
directories.workspace = true
serde.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
rhai = { version = "1.26.1", features = ["sync"] }
tracing.workspace = true

async-compression = { version = "0.4.51", features = ["tokio", "gzip", "zlib", "deflate", "brotli", "zstd"] }
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "server", "http1", "http2"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "tls12", "logging", "ring"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "server", "server-auto", "tokio", "http1", "http2"] }
lru = "0.19.0"
md-5 = "0.11.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
sha2 = "0.11.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1.0.10"
x509-parser = "0.18.1"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
tempfile = "3.27.0"

[lints]
workspace = true
