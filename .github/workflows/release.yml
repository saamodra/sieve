name: Release

# Push a tag like `v0.1.0` to build binaries and publish a GitHub release.
# The tag must match the version in the root Cargo.toml. Running the workflow
# by hand builds everything as a dry run and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            test: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo version
        if: github.ref_type == 'tag'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sieve") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The UI is embedded into the binary, so it must be built first.
      - name: Build web UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Test
        if: matrix.test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p sieve --target ${{ matrix.target }}

      - name: Package
        run: |
          name="sieve-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/sieve" README.md "$name/"
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: sieve-*.tar.gz

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
